name: Build Tauri Android APK
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm install
        
      - name: Force Install missing packages
        run: |
          npm install @tauri-apps/plugin-clipboard-manager

      # ✅ ১. আপনার Base64 সিক্রেট থেকে আসল চাবিটি তৈরি করা
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 --decode > ${{ github.workspace }}/my-release-key.jks
          
      - name: Init Android project
        run: npx tauri android init --ci

      # ✅ ২. Tauri বিল্ড করা (এটি আনসাইনড APK তৈরি করবে)
      - name: Build APK
        run: npx tauri android build --apk

      # ✅ ৩. আপনার নিজের আসল চাবি দিয়ে APK সাইন করা
      - name: Sign APK with Custom Keystore
        run: |
          cd src-tauri/gen/android/app/build/outputs/apk/universal/release/
          
          # ফাইলের নাম পরিবর্তন করা (Tauri কখনো -unsigned নাম দেয়, কখনো দেয় না)
          if [ -f "app-universal-release-unsigned.apk" ]; then
            UNSIGNED_APK="app-universal-release-unsigned.apk"
          else
            UNSIGNED_APK="app-universal-release.apk"
          fi

          # apksigner দিয়ে আপনার নিজের চাবি ব্যবহার করে সাইন করা
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ${{ github.workspace }}/my-release-key.jks \
            --ks-pass pass:${{ secrets.ANDROID_STORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --out app-universal-release-signed.apk \
            $UNSIGNED_APK

      # ✅ ৪. সাইন করা ফাইলটি আপলোড করা (এটি আপনার পুরনো পাথের মতোই)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk
