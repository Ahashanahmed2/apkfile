name: Build Tauri Android APK
on:
  push:
    branches: [ "master" ] # ✅ দুটো ব্রাঞ্চেই কাজ করবে
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # ✅ LFS ফাইল ডাউনলোড করার নির্দেশ

      - name: Force Git LFS Pull
        run: |
          git lfs install
          git lfs pull # ✅ নিশ্চিত করবে যে আসল ফাইলগুলো নেমেছে
          git lfs checkout 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Init Android project
        run: npx tauri android init --ci

      # ⬇️ আইকন ফিক্স স্টেপ ⬇️
      - name: Fix Android Icons
        run: |
          cd src-tauri/gen/android/app/src/main/res/
          rm -rf mipmap-*
          
          sudo apt-get install -y imagemagick
          
          for size in 48 72 96 144 192; do
            mkdir -p mipmap-${size}
          done
          
          convert ../../../../../../icons/icon.png -resize 48x48 mipmap-48/ic_launcher.png
          convert ../../../../../../icons/icon.png -resize 72x72 mipmap-72/ic_launcher.png
          convert ../../../../../../icons/icon.png -resize 96x96 mipmap-96/ic_launcher.png
          convert ../../../../../../icons/icon.png -resize 144x144 mipmap-144/ic_launcher.png
          convert ../../../../../../icons/icon.png -resize 192x192 mipmap-192/ic_launcher.png
          
          mv mipmap-48 mipmap-mdpi
          mv mipmap-72 mipmap-hdpi
          mv mipmap-96 mipmap-xhdpi
          mv mipmap-144 mipmap-xxhdpi
          mv mipmap-192 mipmap-xxxhdpi

      - name: Build APK
        run: npx tauri android build --apk

      - name: Sign APK
        run: |
          cd src-tauri/gen/android/app/build/outputs/apk/universal/release/
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app-universal-release-signed.apk app-universal-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk
